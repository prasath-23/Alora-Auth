      parameters:
      - description: Company id
        in: path
        name: cid
        required: true
        type: string
      - description: Must repeat the company id
        in: header
        name: X-Alora-Target-Company
        required: true
        type: string
      - description: The domain, or null
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SetCompanyDomainRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Company'
        "409":
