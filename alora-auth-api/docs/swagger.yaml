          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set the login policy a group's members sign in under
      tags:
      - owner
  /api/owner/companies/{cid}/groups/{gid}/product-grants:
    put:
      consumes:
      - application/json
      description: 'The COMPLETE set: one role per product, and any product omitted
        loses the grant. Every member''s products see the change at their next refresh,
        or at once through introspection.'
      parameters:
      - description: Company id
        in: path
        name: cid
        required: true
        type: string
      - description: Group id
        in: path
        name: gid
        required: true
        type: string
      - description: Must repeat the company id
        in: header
        name: X-Alora-Target-Company
        required: true
        type: string
      - description: Product grants
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SetGroupProductGrantsRequest'
      responses:
        "204":
          description: Set
        "400":
          description: A product the company does not subscribe to, or a role outside
            its catalogue
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set the product roles a group confers
      tags:
      - owner
  /api/owner/companies/{cid}/login-policies:
    get:
      description: Highest priority first. Exactly one is the company default, which
        applies to everyone with no policy of their own and no group policy.
      parameters:
      - description: Company id
        in: path
        name: cid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
