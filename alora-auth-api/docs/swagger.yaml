          description: OK
          schema:
            $ref: '#/definitions/Company'
        "404":
          description: No such company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a company
      tags:
      - owner
    patch:
      consumes:
      - application/json
      description: 'Send only what changes. `is_active: false` suspends the company:
        nobody in it can sign in, its App Central sessions stop working at once, and
        its products'' logins stop renewing. The platform company cannot be suspended.'
      parameters:
      - description: Company id
        in: path
        name: cid
        required: true
        type: string
      - description: Must repeat the company id
        in: header
        name: X-Alora-Target-Company
        required: true
        type: string
      - description: The changes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Company'
        "400":
          description: Malformed body, or the target header does not match
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The platform company cannot be suspended
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update a company
      tags:
      - owner
  /api/owner/companies/{cid}/domain:
    put:
      consumes:
      - application/json
      description: A verified domain is unique across companies. It is how the login
        page recognises the company's addresses, and what lets its SSO connections
