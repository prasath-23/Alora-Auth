      - description: Group id
        in: path
        name: gid
        required: true
        type: string
      - description: Must repeat the company id
        in: header
        name: X-Alora-Target-Company
        required: true
        type: string
      - description: The policy, or null
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AssignLoginPolicyRequest'
      responses:
        "204":
