  /auth/central/logout:
    post:
      description: 'Ends the App Central session and every product login opened under
        it: no product can renew its tokens afterwards. A product access token already
        issued stays valid until it expires, unless the product introspects it. Always
        204.'
      responses:
        "204":
          description: Signed out, or there was nothing to end
        "403":
          description: Cross-site request refused
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign out of App Central
      tags:
      - sign-in
  /auth/central/refresh:
    post:
      description: |-
        Rotates the refresh token in the session cookie and returns a new App Central access token. Takes no body. The session's rules are checked again first: the user and company active, the login policy still allowing how the user signed in (a session that no longer qualifies is ended), and the absolute fourteen-day cap.

        Presenting a token that was already rotated away means two parties hold the chain, so the session and every product login under it are revoked. The one exception is a benign concurrent rotation, answered 409 with the cookie left intact.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CentralTokenResponse'
        "401":
          description: Session invalid or expired; cookie cleared
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Cross-site request refused
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Concurrent rotation — retry
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Refresh the App Central session
      tags:
      - sign-in
  /auth/google/callback:
    get:
      description: |-
        The return leg from Google. Always answers 302: to the return path on success, to /login for a choice between companies, or to /login?google_error=<code> on failure.

        The state must match the browser's cookie and still be pending (single use, ten minutes). Google's ID token must verify — RS256 against Google's keys, issuer, audience, expiry and nonce. A linked Google identity signs in its accounts; otherwise a verified address signs in, and links, each live account that holds it. Google never creates an account, and each account's policy must allow Google.
      parameters:
      - description: Must match the browser's pending sign-in
        in: query
        name: state
        required: true
        type: string
      - description: Google's authorization code
        in: query
        name: code
        required: true
        type: string
      responses:
        "302":
          description: Redirect to /login?google_error=invalid_request, state_mismatch,
            state_expired, exchange_failed, email_unverified, account_unavailable
            or server_error
      summary: Google sign-in callback
      tags:
      - sign-in
  /auth/google/start:
    get:
      description: 'A browser navigation: answers 302 to Google''s consent screen,
        with PKCE, a state bound to this browser by an HttpOnly cookie, and a nonce
        bound to the ID token. `return_to` must be a path on App Central; anything
        else is dropped.'
      parameters:
      - description: Where to go after signing in
        in: query
        name: return_to
        type: string
      responses:
        "302":
          description: Redirect to /login?google_error=google_disabled when Google
            sign-in is not configured
      summary: Begin Google sign-in
      tags:
      - sign-in
  /auth/login/choices:
    get:
      description: For the page shown after Google proved accounts in several companies.
        The choice is bound to this browser by an HttpOnly cookie and lasts five minutes.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CompanyChoices'
        "401":
          description: No pending choice
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List the companies of a pending account choice
      tags:
      - sign-in
  /auth/login/choose:
    post:
      consumes:
      - application/json
      description: Starts the App Central session in the chosen company. The choice
        is single-use, and the chosen account's login policy is applied again.
      parameters:
      - description: The company
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ChooseCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "401":
          description: No pending choice, or the company is not on offer
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Cross-site request refused
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Complete an account choice
      tags:
      - sign-in
  /auth/login/discover:
    post:
      consumes:
      - application/json
      description: 'Answers from the address''s DOMAIN alone: a company that registered
        the domain on an SSO connection gets that connection; a company with that
        verified domain gets what its default policy allows; any other domain gets
        the defaults. Every address at a domain gets the same answer, so it reveals
        nothing about any account — and every sign-in path enforces the user''s own
        policy regardless.'
      parameters:
      - description: The address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/LoginDiscoverRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginDiscoverResponse'
      summary: Which sign-in methods to offer
      tags:
      - sign-in
  /auth/login/password:
    post:
      consumes:
      - application/json
      description: |-
        Checks the password against every live account that holds the address. When exactly one opens and its company's login policy allows passwords, the App Central session starts: its refresh token is set as the HttpOnly session cookie and an App Central access token is returned. When the password opens accounts in several companies, the answer is `choose_company` with the list — shown only after the password was right — and POST /auth/login/choose completes it.

        No account, a wrong password, and a right password on an account whose policy does not allow passwords all get the same 401, in the same time. Rate limited per minute by ip|email together.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PasswordLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/LoginResponse'
        "400":
          description: Malformed body or unknown field
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Cross-site request refused
          schema:
            $ref: '#/definitions/ErrorResponse'
        "415":
          description: Body is not application/json
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Rate limited
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Sign in with a password
      tags:
      - sign-in
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: |-
        Sets a new password and consumes the reset token. Unauthenticated.

        The field is `new_password`, not `password` — the invite-accept body uses that one, and unknown fields are rejected. Validation failures and unknown tokens collapse to the same 400 message, so a malformed body cannot be distinguished from a token that does not exist.

        Every session of that user ends on success — at App Central and in every product: a reset performed because of a suspected compromise must not leave the attacker's sessions alive.
      parameters:
      - description: Reset token and the new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Password changed; all sessions revoked
        "400":
          description: Invalid or expired reset token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Rate limited
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Reset a password with a token
      tags:
      - passwords
  /auth/sso/callback:
    get:
      description: The return leg from the identity provider. Always answers 302.
        The ID token must verify against the provider's own keys (RS256), with its
        issuer, audience, authorized party, expiry and nonce. A linked subject signs
        in its account. Otherwise the first sign-in links by address — only at a domain
        registered on the connection, with a verified address (unless the Owner trusts
        the connection's addresses), to an account that already exists. SSO never
        creates an account.
      parameters:
      - description: Must match the browser's pending sign-in
        in: query
        name: state
        required: true
        type: string
      - description: The provider's authorization code
        in: query
        name: code
        required: true
        type: string
      responses:
        "302":
          description: Redirect to /login?sso_error=<code>
      summary: Company SSO sign-in callback
      tags:
      - sign-in
  /auth/sso/start:
    get:
      description: 'A browser navigation: answers 302 to the company''s identity provider,
        with PKCE, state and nonce. The connection is named by `connection_id`, or
        found from the domain of `email`.'
      parameters:
      - description: The SSO connection
        in: query
        name: connection_id
        type: string
      - description: An address at a domain registered on a connection
        in: query
        name: email
        type: string
      - description: Where to go after signing in
        in: query
        name: return_to
        type: string
      responses:
        "302":
          description: Redirect to /login?sso_error=sso_unavailable
      summary: Begin company SSO sign-in
      tags:
      - sign-in
  /health:
    get:
      description: 'Reports that the process is running. Deliberately does not touch
        the database: a transient DB fault must not make an orchestrator kill an otherwise
        healthy process. Use /health/ready to decide whether to send traffic.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /health/pressure:
    get:
      description: Returns 503 once heap or RSS crosses the ceiling, so a loaded process
        degrades by shedding traffic instead of being OOM-killed mid-request. Both
        counters are reported either way.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PressureResponse'
        "503":
          description: Over the heap or RSS ceiling
          schema:
            $ref: '#/definitions/PressureResponse'
      summary: Memory-pressure probe
      tags:
      - health
  /health/ready:
    get:
      description: Reports whether this instance can serve traffic, which requires
        a reachable database. The check is bounded at two seconds so a hung connection
        fails the probe instead of hanging it.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
        "503":
          description: Database unreachable
          schema:
            $ref: '#/definitions/HealthResponse'
      summary: Readiness probe
      tags:
      - health
  /oauth/authorize:
    get:
      description: |-
        A browser navigation, started by a product's backend (usually from its `initiate_login_uri` when App Central launches it). With a usable App Central session, and access to the product, it answers 302 straight back to `redirect_uri` with `code`, `state` and `iss` — no page is shown. Without a session it sends the browser to App Central's login page and resumes here afterwards; with `prompt=none` it answers `error=login_required` instead.

        An unknown `client_id` or a `redirect_uri` that is not registered byte for byte is shown as an error here and never redirected. Every later failure redirects to `redirect_uri` with an OAuth error: `unsupported_response_type`, `invalid_request` (PKCE with S256 is required), `invalid_scope`, `login_required` or `access_denied` (no role in the product, no live subscription, or an inactive product). A parameter given twice is refused — `client_id` or `redirect_uri` here, any other with `invalid_request`.
      parameters:
      - description: Must be code
        enum:
        - code
        in: query
        name: response_type
        required: true
        type: string
      - description: The product's id
        in: query
        name: client_id
        required: true
        type: string
      - description: One of the product's registered redirect URIs, exactly
        in: query
        name: redirect_uri
        required: true
        type: string
      - description: openid email profile; openid adds an ID token
        in: query
        name: scope
        type: string
      - description: Echoed back on the redirect
        in: query
        name: state
        type: string
      - description: Echoed in the ID token
        in: query
        name: nonce
        type: string
      - description: base64url(sha256(code_verifier))
        in: query
        name: code_challenge
        required: true
        type: string
      - description: Must be S256
        enum:
        - S256
        in: query
        name: code_challenge_method
        required: true
        type: string
      - description: 'none: never show a page; login: always sign in again'
        in: query
        name: prompt
        type: string
      responses:
        "302":
          description: To redirect_uri with a code, or to the login page
        "400":
          description: Unknown application or unregistered redirect URI
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Authorization endpoint
      tags:
      - provider
  /oauth/introspect:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 'Whether a token is usable RIGHT NOW — for a product that must
        honour sign-out and role changes within seconds rather than when its fifteen-minute
        token expires. A person''s access token (`principal` "user") is active only
        while its product login, the App Central session above it, the user and the
        company are live, the user still has access, and its roles are still current.
        An application''s (`principal` "client") is active only while its API client
        and company are on, the secret it was issued under is live, the product is
        still on the client''s list and usable, and the client still holds every scope
        in it. A product may introspect only tokens for itself; anything else is `{"active":
        false}`. Products only: an API client is `unauthorized_client`.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: An access or refresh token
        in: formData
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/IntrospectionResponse'
        "400":
          description: 'unauthorized_client: an API client'
          schema:
            $ref: '#/definitions/OAuthError'
        "401":
          description: invalid_client
          schema:
            $ref: '#/definitions/OAuthError'
      summary: Introspection endpoint (RFC 7662)
      tags:
      - provider
  /oauth/revoke:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: 'Ends the product login a refresh token or access token belongs
        to — for signing a user out of one product. Authenticated like the token endpoint,
        by products only: an API client is `unauthorized_client`. Always 200, whatever
        the token: an unknown token, an expired one or another product''s is simply
        not acted on.'
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: A refresh or access token
        in: formData
        name: token
        required: true
        type: string
      responses:
        "200":
          description: Done, or nothing to do
        "400":
          description: 'unauthorized_client: an API client'
          schema:
            $ref: '#/definitions/OAuthError'
        "401":
          description: invalid_client
          schema:
            $ref: '#/definitions/OAuthError'
      summary: Revocation endpoint (RFC 7009)
      tags:
      - provider
  /oauth/token:
    post:
      consumes:
      - application/x-www-form-urlencoded
      description: |-
        Called by a product's backend or an application, never a browser: form-encoded (application/x-www-form-urlencoded), authenticated with HTTP Basic (client_secret_basic, the client id and secret each form-encoded). Every response is `Cache-Control: no-store`.

        `grant_type=authorization_code` redeems a code with `code`, `redirect_uri` (exactly as sent to /oauth/authorize) and the PKCE `code_verifier`. A code works once; presenting it again revokes the login it opened. The result is an access token for this product alone (audience `product:<key>`, this product's roles only, fifteen minutes), a refresh token, and — when the scope included openid — an ID token.

        `grant_type=refresh_token` rotates the refresh token: the old one stops working, and replaying it revokes this product's login. Each refresh checks everything again — the App Central session above it, the user, the company, the login policy and the user's access to the product — and a login that no longer qualifies is ended.

        `grant_type=client_credentials` is for API clients only (products use the two grants above): `resource=product:<key>` (RFC 8707) names one product on the client's list, and the optional `scope` asks for some of the scopes it holds (all of them without it). The result is an access token for that product (audience `product:<key>`, `principal` "client", its `scope`, no roles, fifteen minutes) with no refresh token and no ID token. A product unknown, not on the list or not usable is `invalid_target`; a scope the client lacks is `invalid_scope`; a grant the client may not use is `unauthorized_client`.
      parameters:
      - description: Basic base64(client_id:client_secret)
        in: header
        name: Authorization
        required: true
        type: string
      - description: authorization_code, refresh_token or client_credentials
        in: formData
        name: grant_type
        required: true
        type: string
      - description: 'authorization_code: the code'
        in: formData
        name: code
        type: string
      - description: 'authorization_code: the redirect URI'
        in: formData
        name: redirect_uri
        type: string
      - description: 'authorization_code: the PKCE verifier'
        in: formData
        name: code_verifier
        type: string
      - description: 'refresh_token: the refresh token'
        in: formData
        name: refresh_token
        type: string
      - description: 'client_credentials: product:<key>'
        in: formData
        name: resource
        type: string
      - description: 'client_credentials: the scopes wanted, space-separated'
        in: formData
        name: scope
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/OAuthTokenResponse'
        "400":
          description: invalid_request, invalid_grant, invalid_target, invalid_scope,
            unauthorized_client or unsupported_grant_type
          schema:
            $ref: '#/definitions/OAuthError'
        "401":
          description: invalid_client
          schema:
            $ref: '#/definitions/OAuthError'
        "409":
          description: A concurrent refresh of the same token
          schema:
            $ref: '#/definitions/OAuthError'
      summary: Token endpoint
      tags:
      - provider
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    description: 'An App Central access token from /auth/login/password or /auth/central/refresh.
      Enter it as: Bearer &lt;token&gt;'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Liveness, readiness and load-shedding probes. Unauthenticated.
  name: health
- description: The OpenID Provider metadata and signing keys. Public, and readable
    from any origin.
  name: standards
- description: The OpenID Provider endpoints products integrate with.
  name: provider
- description: 'App Central sign-in: password, the company chooser, Google, company
    SSO, and the session.'
  name: sign-in
- description: The signed-in person's own account and apps.
  name: me
- description: Issuing invitations, and redeeming them without a session.
  name: invitations
- description: Administrator-issued resets and redeeming them.
  name: passwords
- description: A company's users, for its Admins and delegates.
  name: users
- description: A company's groups and their members.
  name: groups
- description: A company's live sign-ins.
  name: sessions
- description: 'A company''s API clients: applications'' identities — a client ID
    and secret, the products each may get a token for, and where that token may be
    used (REST, gRPC, MCP).'
  name: api-clients
- description: A company's own record and its product subscriptions.
  name: tenant
- description: 'The Owner console: every company, product registration, groups, login
    policies and SSO. The company-scoped user, invitation, group-membership and password-reset
    operations documented under /api/admin are also served for ANY company at the
    same path under /api/owner/companies/{cid} — /users (with /scopes and /password-reset),
    /invitations, /groups (with /scopes, /members and /managers) and /api-clients
    (with /scopes, /products and /secrets) — with the same bodies and the X-Alora-Target-Company
    echo on writes.'
  name: owner
