info:
  contact:
    name: Alora Platform
    url: https://alora.io/support
  description: |-
    App Central: one sign-in for every product of the platform, and the OpenID Provider those products trust.

    ## Two kinds of token
    People sign in once at App Central — with a password, Google, or their company's SSO, as their company's login policy allows. That opens an App Central session (an HttpOnly cookie) and yields an App Central access token (audience `app-central`), the ONLY token the `/api` routes accept. It describes everything about App Central: `scope` (what the person may do here) and `products` (the keys of the apps they may open). A product never sees it: when a product is launched, its backend runs an ordinary OpenID Connect authorization-code flow with PKCE against `/oauth/authorize` and `/oauth/token`, and receives a token for itself alone (audience `product:<key>`, carrying only its own roles).

    ## Scopes
    Every `/api/admin` route names the App Central scope it needs: `<feature>:read` to look, `<feature>:edit` to change (edit includes read). The features are users, groups, invitations, sessions, products (read only), company and api-clients; everyone signed in holds `apps:read`, and a platform Owner also holds `owner`. A person's scopes are their groups' plus extras given to them alone, and the Admins group holds every scope. Nobody gives or takes away a scope they do not hold, and nobody acts on someone with more access than they have (403, in those words); the Owner is bound by neither. The token's claims are a snapshot: App Central re-reads the person's access on every request, and a response carries `X-Alora-Token-Stale: 1` when the token no longer describes it — refresh, and read `/api/me` again.

    ## Group managers
    A group's managers add and remove its members, and nothing else, without `groups:edit` for the whole company. Holders of `groups:edit` appoint them (`POST /api/admin/groups/{id}/managers`) under the same two rules: they must hold every scope the group gives, since a manager can hand the group out, and the person may have no more reach than they have — reach being the scopes someone holds plus those of the groups they manage, which is what the second rule measures everywhere. Nobody appoints themselves; the Admins group never has managers. A manager works through `/api/me/managed-groups`, which needs no scope and opens only on the groups they manage, never on the group's managers themselves.

    ## Authorizing requests here
    Sign in with `POST /auth/login/password`, copy `access_token` from the response, then press **Authorize** and paste it. Every `/api` route reads the bearer token from the `Authorization` header only — never from a cookie — and re-checks its session against the database on every request.

    ## Companies
    No `/api/admin` endpoint accepts a company identifier: each is scoped to the caller's own company. Only the Owner console (`/api/owner`) names a company, in the path, and every write there must repeat it in the `X-Alora-Target-Company` header. The company-management routes are documented at their `/api/admin` path; the Owner console serves each of them for any company at the same path under `/api/owner/companies/{cid}` (for example `PUT /api/owner/companies/{cid}/groups/{gid}/scopes`).

    ## Errors
    Every failure renders as `{"error": "<safe label>", "reqId": "<request id>"}`, except the token, revocation and introspection endpoints, which answer in the RFC 6749 shape `{"error": "<code>", "error_description": "..."}`. Quote `reqId` when reporting a problem.
  license:
    name: Proprietary
  termsOfService: https://alora.io/terms
  title: App Central API
  version: "2.0"
paths:
  /.well-known/jwks.json:
    get:
      description: The RS256 public keys every token is signed with, including any
        key being retired during a rotation. Products verify their access tokens and
        ID tokens offline against these. Cached for five minutes, so a rotated key
        propagates quickly without every verifier hitting this endpoint on every request.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/JWKS'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Public signing keys (JWKS)
      tags:
      - standards
  /.well-known/openid-configuration:
    get:
      description: 'Where a product finds everything else: the authorize, token, revocation
        and introspection endpoints, the JWKS, and exactly what is supported — the
        code flow with S256 PKCE, client_secret_basic, RS256.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/OpenIDConfiguration'
      summary: OpenID Provider metadata
      tags:
      - standards
  /api/admin/api-clients:
    get:
      description: 'Every API client of the company: what each may get a token for
        (`products`), where that token may be used (`scopes`) and how many live secrets
        it has. Never a secret. Needs `api-clients:read`.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/APIClient'
            type: array
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks api-clients:read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List API clients
      tags:
      - api-clients
    post:
      consumes:
      - application/json
      description: An application's identity. It starts with no scopes, no products
        and no secret, so it can do nothing until each is chosen. Its `id` is its
        OAuth `client_id`. Needs `api-clients:edit`.
      parameters:
      - description: Its name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateAPIClientRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/APIClient'
        "400":
          description: Malformed body
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks api-clients:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: An API client with this name already exists
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create an API client
      tags:
      - api-clients
  /api/admin/api-clients/{id}:
    delete:
      description: Its scopes, products and secrets go with it, and it gets no token
        again. The audit trail keeps what it was. Needs `api-clients:edit`.
      parameters:
      - description: API client id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Deleted
        "403":
          description: Caller lacks api-clients:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such API client in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete an API client
      tags:
      - api-clients
    get:
      description: 'One API client with its secrets — each told apart by its prefix,
        never its value — and `product_choices`: the products that could go on its
        list (live subscriptions to products that accept API clients). Needs `api-clients:read`.'
      parameters:
      - description: API client id (its client_id)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIClientDetail'
        "403":
          description: Caller lacks api-clients:read
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such API client in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get an API client
      tags:
      - api-clients
    patch:
      consumes:
      - application/json
      description: Its complete settable state. Switched off (`is_active` false),
        it gets no token, whatever its secrets. Needs `api-clients:edit`.
      parameters:
      - description: API client id
        in: path
        name: id
        required: true
        type: string
      - description: Name, description and whether it is on
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateAPIClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIClient'
        "400":
          description: Malformed body
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks api-clients:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such API client in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: An API client with this name already exists
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change an API client
      tags:
      - api-clients
  /api/admin/api-clients/{id}/products:
    put:
      consumes:
      - application/json
      description: 'The COMPLETE list: any product omitted is taken off. A product
        added must be one the company subscribes to, and one the Owner has let accept
        API clients; a product already on the list may stay, and earns no token while
        it is not usable. Needs `api-clients:edit`.'
      parameters:
      - description: API client id
        in: path
        name: id
        required: true
        type: string
      - description: The complete list of product ids
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SetAPIClientProductsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIClientProductsResponse'
        "400":
          description: Malformed body, or a product that cannot be added
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks api-clients:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such API client in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set the products an API client may get a token for
      tags:
      - api-clients
  /api/admin/api-clients/{id}/scopes:
    put:
      consumes:
      - application/json
      description: 'The COMPLETE set of application scopes: `api:read` / `api:edit`
        (a product''s REST API), `grpc:read` / `grpc:edit` (its gRPC services) and
        `mcp:tools` (its MCP tools). Any scope omitted is taken away, and an edit
        scope brings its read scope. Its product tokens carry these, or fewer. Needs
        `api-clients:edit`.'
      parameters:
      - description: API client id
        in: path
        name: id
        required: true
        type: string
      - description: The complete set of scopes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SetAPIClientScopesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/APIClientScopesResponse'
        "400":
          description: Malformed body, or a scope that is not an application scope
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks api-clients:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such API client in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set where an API client's credential may be used
      tags:
      - api-clients
  /api/admin/api-clients/{id}/secrets:
    post:
      consumes:
      - application/json
      description: 'Returns the secret''s value THIS ONCE: App Central keeps only
        its hash. At most two secrets are live at a time, so a client rotates without
        downtime — make a second, deploy it, then revoke the first. The body is optional;
        `expires_in_days` limits the secret''s life. Needs `api-clients:edit`.'
      parameters:
      - description: API client id
        in: path
        name: id
        required: true
        type: string
      - description: Optional lifetime
        in: body
        name: request
        schema:
          $ref: '#/definitions/CreateAPIClientSecretRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/NewAPIClientSecret'
        "400":
          description: Malformed body
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks api-clients:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such API client in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: It already has two live secrets
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Make an API client a secret
      tags:
      - api-clients
  /api/admin/api-clients/{id}/secrets/{sid}:
    delete:
      description: It stops working at once. The secret is kept, revoked, so the record
        says it existed. Needs `api-clients:edit`.
      parameters:
      - description: API client id
        in: path
        name: id
        required: true
        type: string
      - description: Secret id
        in: path
        name: sid
        required: true
        type: string
      responses:
        "204":
          description: Revoked
        "403":
          description: Caller lacks api-clients:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such live secret of this API client
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an API client's secret
      tags:
      - api-clients
  /api/admin/client:
    get:
      description: 'The organisation of the caller: its name, domain, plan and standing.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ClientDetail'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks company:read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get the company record
      tags:
      - tenant
    patch:
      consumes:
      - application/json
      description: 'The name is all an Admin may change. The plan, the company''s
        standing and its domain are the Owner''s to set: an Admin must not be able
        to un-suspend their own company or verify a domain for it.'
      parameters:
      - description: The new name
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/ClientDetail'
        "400":
          description: Unknown field, or a name outside 1-200 characters
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks company:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename the company
      tags:
      - tenant
  /api/admin/groups:
    get:
      description: Every group in the company with what it gives — App Central scopes
        and product roles — its login policy, and how many members it has. The Admins
        group (`system_key` ADMINS) is always present and holds every scope. Needs
        `groups:read`.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/GroupListItem'
            type: array
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List groups
      tags:
      - groups
    post:
      consumes:
      - application/json
      description: 'Creates a group with the App Central scopes it gives, in one transaction.
        Needs `groups:edit`, and you can only give scopes you hold yourself (the Owner
        excepted). An edit scope brings its read scope. Product grants are the Owner''s
        alone: each must name a product the company subscribes to and a role in its
        catalogue.'
      parameters:
      - description: The group
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateGroupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/GroupResponse'
        "400":
          description: Malformed body, an unknown scope, or an unusable product grant
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:edit, lacks a scope they tried to give,
            or is not the Owner and gave products
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: A group with this name already exists
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a group
      tags:
      - groups
  /api/admin/groups/{id}:
    delete:
      description: Memberships and grants cascade; members lose what the group gave.
        Needs `groups:edit`, and deleting takes the group's scopes away from its members,
        so you must hold all of them (the Owner excepted). A group that gives products
        is the Owner's to delete. The Admins group cannot be deleted.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Deleted
        "403":
          description: Caller lacks groups:edit or one of the group's scopes, or the
            group gives products
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: This is the Admins group
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a group
      tags:
      - groups
    get:
      description: One group with what it grants and its members. A group with no
        members returns an empty `members` array, never null.
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GroupDetail'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:read
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a group
      tags:
      - groups
    patch:
      consumes:
      - application/json
      description: Needs `groups:edit`. The Admins group cannot be renamed.
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: string
      - description: Name and description
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateGroupRequest'
      responses:
        "204":
          description: Updated
        "403":
          description: Caller lacks groups:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The name is taken, or this is the Admins group
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rename a group
      tags:
      - groups
  /api/admin/groups/{id}/managers:
    post:
      consumes:
      - application/json
      description: 'Makes someone — by EITHER `user_id` or `email` — a manager of
        the group: they may add and remove its members, and nothing else, without
        `groups:edit`. Needs `groups:edit` and every scope the group gives (a manager
        can hand the group out), and the person may have no more reach than you: the
        scopes they hold plus those of the groups they already manage. You can''t
        appoint yourself, and the Admins group never has managers. The Owner console
        appoints at /api/owner/companies/{cid}/groups/{gid}/managers, bound by neither
        scope rule.'
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: id
        required: true
        type: string
      - description: User id or email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AppointGroupManagerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/GroupManagerAppointment'
        "400":
          description: Neither user_id nor email, a malformed body, or yourself
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:edit, lacks one of the group's scopes,
            or the person has more reach
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group or user in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The Admins group, or they already manage it
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Appoint a group manager
      tags:
      - groups
  /api/admin/groups/{id}/managers/{userId}:
    delete:
      description: Ends an appointment. Needs `groups:edit` and every scope the group
        gives, and the manager may have no more reach than you. The Owner console
        dismisses at /api/owner/companies/{cid}/groups/{gid}/managers/{uid}.
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: id
        required: true
        type: string
      - description: User id
        example: 4b5c6d7e-8f90-1a2b-3c4d-5e6f7a8b9c0d
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Dismissed
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:edit, lacks one of the group's scopes,
            or the manager has more reach
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group, user or appointment in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Dismiss a group manager
      tags:
      - groups
  /api/admin/groups/{id}/members:
    post:
      consumes:
      - application/json
      description: Identify the user by EITHER `user_id` or `email`. Both the group
        and the user must belong to the company. Adding someone to the Admins group
        makes them an Admin at once.
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: id
        required: true
        type: string
      - description: User id or email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AddMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AddMemberResponse'
        "400":
          description: Neither user_id nor email supplied, or a malformed body
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:edit, lacks one of the group's scopes,
            or the person has more access
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group or user in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: User is already a member of this group
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a member to a group
      tags:
      - groups
  /api/admin/groups/{id}/members/{userId}:
    delete:
      description: Scoped by user, group and company together. The company's last
        active Admin cannot be removed from the Admins group.
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: id
        required: true
        type: string
      - description: User id
        example: 4b5c6d7e-8f90-1a2b-3c4d-5e6f7a8b9c0d
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Removed
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:edit, lacks one of the group's scopes,
            or the person has more access
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such membership in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The last active Admin
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a member from a group
      tags:
      - groups
  /api/admin/groups/{id}/scopes:
    put:
      consumes:
      - application/json
      description: 'The COMPLETE set of App Central scopes: any scope omitted is taken
        away, and an edit scope brings its read scope. Needs `groups:edit`, and you
        can only give or take away scopes you hold yourself (the Owner excepted).
        The Admins group holds every scope and takes none. Every member''s next request
        sees the change.'
      parameters:
      - description: Group id
        in: path
        name: id
        required: true
        type: string
      - description: The complete set of scopes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SetGroupScopesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GroupScopesResponse'
        "400":
          description: Malformed body or an unknown scope
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks groups:edit, or lacks a scope they tried to give
            or take
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such group in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: This is the Admins group
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set the scopes a group gives
      tags:
      - groups
  /api/admin/invitations:
    get:
      description: Every invitation of the company, in any status. Token hashes are
        never projected, and the invite link is not recoverable here — an invitation
        whose link was lost must be revoked and re-issued.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/InvitationListItem'
            type: array
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks invitations:read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List invitations
      tags:
      - invitations
    post:
      consumes:
      - application/json
      description: |-
        Issues an invitation into the company, naming the groups the new account joins — which is what gives it access (and, for the Admins group, makes it an Admin). There is no company field: it comes from the route.

        Refused if the address already belongs to a live member, or already has a live invitation. `invite_url` is returned so the link can be shared by hand when SMTP is not configured; email delivery is best-effort and off the response path.
      parameters:
      - description: Address to invite, and the groups to join
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CreateInvitationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/CreateInvitationResponse'
        "400":
          description: Malformed body, or a group of another company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks invitations:edit, or lacks a scope one of the
            groups gives
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Address already belongs to a user, or already has a live invitation
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Invite a user
      tags:
      - invitations
  /api/admin/invitations/{id}:
    delete:
      description: Cancels a PENDING invitation so its link stops working. An id from
        another organisation affects no rows and reports 404.
      parameters:
      - description: Invitation id
        example: 8c1d2e3f-4a5b-6c7d-8e9f-0a1b2c3d4e5f
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Revoked
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks invitations:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No pending invitation with that id in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an invitation
      tags:
      - invitations
  /api/admin/products:
    get:
      description: The products the company subscribes to. `id` is the SUBSCRIPTION
        id; the product itself is `product_id`.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ProductListItem'
            type: array
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks products:read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List product subscriptions
      tags:
      - tenant
  /api/admin/sessions:
    get:
      description: 'Every live sign-in in the company of the caller: App Central sessions
        (kind CENTRAL) and the product logins opened under them (kind PRODUCT, with
        the product''s key). Most recently used first. Each names its user by address;
        no token hashes and no user ids are projected, and the device label is display-only,
        never used for a security decision.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/SessionListItem'
            type: array
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks sessions:read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List live sessions
      tags:
      - sessions
  /api/admin/sessions/{id}:
    delete:
      description: |-
        Ends one sign-in. Revoking an App Central session also ends every product login opened under it; revoking a product login ends only that. The next refresh of anything revoked fails, and App Central's own access tokens for the session stop working at once.

        A product's access token already issued stays valid until it expires (at most fifteen minutes) unless the product introspects it. Scoped to the company of the caller: a session id from another organisation reports 404.
      parameters:
      - description: Session id
        example: 7e8f9a0b-1c2d-3e4f-5a6b-7c8d9e0f1a2b
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Revoked
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks sessions:edit
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such live session in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke a session
      tags:
      - sessions
  /api/admin/users:
    get:
      description: |-
        One keyset page of the company's users, with their groups and whether each is an Admin or an Owner.

        Pass the `nextCursor` of a response as `cursor` to fetch the following page; a null `nextCursor` means there is no further page. The cursor is an opaque user id — internally a (created_at, id) position, stable under concurrent inserts in a way OFFSET is not. A cursor from another company simply fails to resolve.
      parameters:
      - description: nextCursor from the previous page
        in: query
        name: cursor
        type: string
      - default: 25
        description: Page size, 1-100
        in: query
        maximum: 100
        minimum: 1
        name: take
        type: integer
      - description: A literal, case-insensitive part of the address
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserListResponse'
        "400":
          description: take out of range, or a cursor that does not resolve in this
            company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks users:read
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /api/admin/users/{id}:
    get:
      description: |-
        One user with everything that decides what they can do: their groups, their direct product grants, their effective access (direct and through groups, each with its source) and the login policy that applies to them, with where it came from.

        An unknown id and an id belonging to another organisation are answered identically.
      parameters:
      - description: User id
        example: 4b5c6d7e-8f90-1a2b-3c4d-5e6f7a8b9c0d
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserDetail'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks users:read
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such user in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        The only editable field is `is_active`. Deactivation takes effect at once: every session of the user ends — at App Central and in every product — and App Central's tokens for them stop working on their next request.

        Needs `users:edit`. Nobody may modify their own account here; nobody may act on someone with more access than they have (the Owner excepted); and the company's last active Admin cannot be deactivated.
      parameters:
      - description: User id
        example: 4b5c6d7e-8f90-1a2b-3c4d-5e6f7a8b9c0d
        in: path
        name: id
        required: true
        type: string
      - description: New active state
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UpdateUserResponse'
        "400":
          description: Malformed body, or the target is the caller
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks users:edit, or the target has more access than
            the caller
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such user in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: The target is the last active Admin
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Activate or deactivate a user
      tags:
      - users
  /api/admin/users/{id}/password-reset:
    post:
      description: |-
        Mints a reset link for a user in the company. Needs `users:edit`. A reset is an account-takeover primitive, so nobody may reset someone with more access than they have (the Owner excepted).

        Any token already outstanding for that user is deleted first, so exactly one link is ever live. The link is emailed; only outside production, with no mail configured, is reset_url returned instead. Production without mail answers 503.
      parameters:
      - description: User id
        example: 4b5c6d7e-8f90-1a2b-3c4d-5e6f7a8b9c0d
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/IssueResetResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks users:edit, or the target has more access than
            the caller
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such user in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
        "503":
          description: Production with no mail configured
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Issue a password reset for a user
      tags:
      - passwords
  /api/admin/users/{id}/scopes:
    put:
      consumes:
      - application/json
      description: |-
        The COMPLETE set of App Central scopes given to this person alone, on top of what their groups give: any scope omitted is taken away. An edit scope brings its read scope.

        Needs `users:edit`, and the two scope rules apply: you can only give or take away scopes you hold yourself, and only for someone with no more access than you (the Owner is bound by neither). Nobody changes their own extras. The person's next request sees the change; their login token says so with `X-Alora-Token-Stale`.
      parameters:
      - description: User id
        example: 4b5c6d7e-8f90-1a2b-3c4d-5e6f7a8b9c0d
        in: path
        name: id
        required: true
        type: string
      - description: The complete set of extra scopes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/SetUserScopesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/UserScopesResponse'
        "400":
          description: Malformed body, an unknown scope, or the target is the caller
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Caller lacks users:edit, lacks a scope they tried to give or
            take, or the target has more access
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: No such user in this company
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set a person's extra scopes
      tags:
      - users
  /api/me:
    get:
      description: Who the caller is, in which company, whether they are an Admin
        or an Owner, and which admin feature keys they hold (an Admin holds all).
        App Central uses it to decide what to show; every route re-checks its own
        guard server-side.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/Me'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Your account
      tags:
      - me
  /api/me/apps:
    get:
      description: The products the caller may use right now — a role through a group
        or granted directly, a live subscription, an active product — each with the
        caller's roles in it and a `launch_url` that starts the product's own sign-in.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/App'
            type: array
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Your apps
      tags:
      - me
  /api/me/change-password:
    post:
      consumes:
      - application/json
      description: 'The current password is re-verified even though the caller holds
        a valid token: that re-authentication is what stops a stolen token from becoming
        permanent account takeover. A wrong one is 403, not 401 — the token was fine,
        and a client that refreshes on 401 must not re-send the guess — and each account
        gets five attempts per fifteen minutes, however many addresses they come from.
        On success every session of the account ends — this one too — so the caller
        signs in again.'
      parameters:
      - description: Current and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Password changed; every session ended
        "400":
          description: Malformed body, or the account has no password
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: The current password is incorrect
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Too many attempts for this account
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Change your own password
      tags:
      - me
  /api/me/managed-groups:
    get:
      description: Every group the caller manages, with what it gives and how many
        members it has. Empty for anyone who manages none; needs no scope.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/GroupListItem'
            type: array
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: The groups I manage
      tags:
      - me
  /api/me/managed-groups/{gid}:
    get:
      description: 'One group the caller manages: its members, its managers, what
        it gives and the sign-in policy it carries — adding someone can put them under
        that policy. A group the caller does not manage is not found.'
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: gid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/GroupDetail'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not a group you manage
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: A group I manage
      tags:
      - me
  /api/me/managed-groups/{gid}/members:
    post:
      consumes:
      - application/json
      description: Identify the person by EITHER `user_id` or `email`. They must have
        no more reach than you — the scopes you hold plus those of the groups you
        manage — and may not be one of the group's managers, you included. Budgeted
        per account.
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: gid
        required: true
        type: string
      - description: User id or email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/AddMemberRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/AddMemberResponse'
        "400":
          description: Neither user_id nor email, or a malformed body
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: One of the group's managers, or someone with more reach
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not a group you manage, or no such user
          schema:
            $ref: '#/definitions/ErrorResponse'
        "409":
          description: Already a member
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Too many changes; see Retry-After
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a member to a group I manage
      tags:
      - me
  /api/me/managed-groups/{gid}/members/{uid}:
    delete:
      description: The member must have no more reach than you and may not be one
        of the group's managers, you included. Budgeted per account.
      parameters:
      - description: Group id
        example: 1a2b3c4d-5e6f-7a8b-9c0d-1e2f3a4b5c6d
        in: path
        name: gid
        required: true
        type: string
      - description: User id
        example: 4b5c6d7e-8f90-1a2b-3c4d-5e6f7a8b9c0d
        in: path
        name: uid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Removed
        "401":
          description: Missing, invalid or stale token
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: One of the group's managers, or someone with more reach
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not a group you manage, or not a member
          schema:
            $ref: '#/definitions/ErrorResponse'
        "429":
          description: Too many changes; see Retry-After
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Remove a member from a group I manage
      tags:
      - me
  /api/owner/api-clients:
